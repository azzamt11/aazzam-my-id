services:
  portfolio:
    build: .
    image: aazzam-portfolio:latest
    container_name: aazzam-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
